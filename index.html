<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ครบรอบ 9 เดือนแย้วน้าา ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-deep:#0d0620;
    --ink:#fff;
    --ink-2:rgba(255,255,255,.74);
    --pink:#ff8fc7;
    --gold:#ffd98a;
    --spring:cubic-bezier(.22,1.2,.36,1);
    --ease-out:cubic-bezier(.2,.9,.25,1);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{width:100%; height:100%; overflow:hidden; background:var(--plum-deep); color:var(--ink);
    font-family:'Sarabun',-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none;}
  #stage{position:fixed; inset:0;}
  canvas{display:block; touch-action:none;}
  #veil{position:fixed; inset:0; background:var(--plum-deep); z-index:50; transition:opacity 1.4s ease;}
  #veil.hide{opacity:0; pointer-events:none;}
  #veilText{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#f6d998; font-size:13px; letter-spacing:.3em; opacity:.65;}

  /* ---------- liquid glass (iOS 26 style) ---------- */
  .glass{
    position:relative; isolation:isolate;
    background:
      radial-gradient(130% 120% at 18% -10%, rgba(255,255,255,.30) 0%, rgba(255,255,255,.09) 42%, rgba(255,255,255,.035) 100%),
      linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
    -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.1);
    backdrop-filter:blur(22px) saturate(190%) brightness(1.1);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.6),
      inset 0 -1.5px 0 rgba(255,255,255,.12),
      inset 1.5px 0 0 rgba(255,255,255,.16),
      inset -1.5px 0 0 rgba(255,255,255,.09),
      inset 0 0 26px rgba(255,255,255,.07),
      0 20px 54px rgba(8,2,26,.5),
      0 2px 10px rgba(8,2,26,.3);
  }
  .glass::before{ /* light catching the rim */
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1.2px; z-index:2; pointer-events:none;
    background:linear-gradient(142deg, rgba(255,255,255,.95), rgba(255,255,255,.14) 28%, rgba(255,255,255,.03) 52%, rgba(255,170,215,.34) 78%, rgba(255,255,255,.75));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  .glass::after{ /* soft sheen on the upper half */
    content:''; position:absolute; left:0; right:0; top:0; height:55%; border-radius:inherit; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,0));
  }
  .glass > *{position:relative; z-index:1;}
  .glass > .streak{position:absolute; z-index:0;}
  .streak{inset:0; border-radius:inherit; overflow:hidden; pointer-events:none;}
  .streak::before{content:''; position:absolute; top:-30%; bottom:-30%; width:34%; left:-60%; transform:skewX(-20deg);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
    animation:streak 8s ease-in-out infinite 2s;}
  @keyframes streak{0%,58%{left:-60%} 100%{left:135%}}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass{background:rgba(58,34,98,.72);}
  }

  /* sweet pink glass for the opening page */
  .rose{
    background:
      radial-gradient(130% 120% at 18% -10%, rgba(255,214,236,.42) 0%, rgba(255,150,200,.17) 44%, rgba(255,110,180,.10) 100%),
      linear-gradient(180deg, rgba(255,150,200,.21), rgba(255,100,170,.09));
    box-shadow:
      inset 0 1.5px 0 rgba(255,238,246,.72),
      inset 0 -1.5px 0 rgba(255,170,215,.22),
      inset 1.5px 0 0 rgba(255,200,230,.2),
      inset -1.5px 0 0 rgba(255,170,215,.12),
      inset 0 0 26px rgba(255,150,200,.13),
      0 20px 54px rgba(110,10,70,.42),
      0 2px 10px rgba(110,10,70,.3);
  }
  .rose::before{
    background:linear-gradient(142deg, rgba(255,238,246,.96), rgba(255,175,218,.32) 30%, rgba(255,140,200,.08) 55%, rgba(255,150,210,.52) 80%, rgba(255,238,246,.82));
  }

  /* ---------- opening: title on top, hint under the heart, countdown at the bottom ---------- */
  #head,#dock{position:fixed; left:50%; z-index:12; width:min(calc(100vw - 28px), 420px);
    opacity:0; transition:opacity .9s ease .1s, transform 1.2s var(--ease-out) .1s;}
  #head{top:max(18px, calc(env(safe-area-inset-top) + 10px)); padding:13px 20px 15px; border-radius:30px; text-align:center;
    transform:translate(-50%,-22px) scale(.97);}
  #dock{bottom:max(16px, calc(env(safe-area-inset-bottom) + 10px)); display:flex; flex-direction:column; align-items:center; gap:8px;
    transform:translate(-50%,26px) scale(.97);}
  #head.show,#dock.show{opacity:1; transform:translate(-50%,0) scale(1);}
  #head.gone{opacity:0; transform:translate(-50%,-34px) scale(.95); pointer-events:none;
    transition:opacity .7s ease, transform 1s cubic-bezier(.5,0,.75,0);}
  #dock.gone{opacity:0; transform:translate(-50%,40px) scale(.94); pointer-events:none;
    transition:opacity .7s ease, transform 1s cubic-bezier(.5,0,.75,0);}
  #head .to{font-size:14px; font-weight:500; color:rgba(255,228,240,.86);}
  #head h1{font-size:clamp(21px,6.3vw,32px); line-height:1.25; font-weight:600; letter-spacing:-.01em; margin-top:2px;
    text-wrap:balance; text-shadow:0 2px 22px rgba(255,90,170,.55);}
  #lead{padding:10px 20px; border-radius:99px; font-size:14.5px; color:rgba(255,255,255,.93); text-align:center;}
  #lead.breathe{animation:breathe 3.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1)} 50%{transform:scale(1.04)}}
  #count{width:100%; border-radius:30px; padding:13px 13px 12px; text-align:center;}
  #count .cap{font-size:13px; color:rgba(255,228,240,.86); margin-bottom:9px;}
  #count .cells{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  #count .cell{border-radius:18px; padding:8px 0 7px; font-variant-numeric:tabular-nums;
    background:rgba(150,30,95,.24); box-shadow:inset 0 1px 0 rgba(255,225,240,.24), inset 0 0 0 .5px rgba(255,200,230,.2);}
  #count .cell b{display:block; font-size:24px; font-weight:600; line-height:1.15;}
  #count .cell span{font-size:11.5px; color:rgba(255,228,240,.8);}
  #count .cell.tick b{animation:tick .38s var(--ease-out);}
  @keyframes tick{0%{opacity:.25; transform:translateY(-5px)} 100%{opacity:1; transform:none}}
  #count.done .cells{display:none;}
  #count.done .cap{font-size:16px; color:#fff; margin:2px 0;}

  /* ---------- small glass pieces ---------- */
  #sound,#replay{position:fixed; top:max(14px, env(safe-area-inset-top)); right:14px; width:46px; height:46px; border-radius:50%;
    display:grid; place-items:center; border:0; color:#fff; z-index:14; cursor:pointer;
    opacity:0; transition:opacity 1s ease .6s, transform .4s var(--spring);}
  #replay{top:calc(max(14px, env(safe-area-inset-top)) + 54px); pointer-events:none;}
  #sound:not(.show){pointer-events:none;}
  #sound.show,#replay.show{opacity:1;}
  #replay.show{pointer-events:auto;}
  #sound:active,#replay:active{transform:scale(.88);}
  #sound svg,#replay svg{width:21px; height:21px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  #sound .x{display:none;} #sound.off .wave{display:none;} #sound.off .x{display:block;}
  #hint{position:fixed; left:50%; z-index:11; bottom:max(22px, calc(env(safe-area-inset-bottom) + 14px));
    padding:11px 20px; border-radius:99px; font-size:13.5px; color:rgba(255,255,255,.9); white-space:nowrap; pointer-events:none;
    opacity:0; transform:translate(-50%,14px); transition:opacity 1.2s ease, transform 1.2s var(--ease-out);}
  #hint.show{opacity:1; transform:translate(-50%,0);}
  #vig{position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(120% 95% at 50% 46%, rgba(20,4,34,0) 42%, rgba(24,4,36,.62) 100%);}
  #tags{position:fixed; inset:0; z-index:13; pointer-events:none; overflow:hidden;}
  .tag{position:absolute; left:0; top:0; padding:7px 14px; border-radius:99px; font-size:13px; font-weight:500; white-space:nowrap; opacity:0; will-change:transform,opacity;}

  @media (max-height:700px){
    #head{padding:11px 18px 12px; border-radius:26px;}
    #head h1{font-size:clamp(21px,6vw,28px);}
    #dock{gap:9px;}
    #lead{padding:8px 18px; font-size:14px;}
    #count{padding:10px 11px 10px; border-radius:26px;}
    #count .cap{margin-bottom:7px; font-size:12.5px;}
    #count .cell{padding:6px 0 5px;}
    #count .cell b{font-size:21px;}
  }
  @media (max-height:520px){ #count .cap{display:none;} }
  @media (prefers-reduced-motion:reduce){ .streak::before{animation:none;} }

  /* ---------- letter + gallery buttons (appear once the tree has grown) ---------- */
  #keepsakes{position:fixed; left:50%; z-index:11; bottom:max(60px, calc(env(safe-area-inset-bottom) + 52px));
    display:flex; flex-direction:column; align-items:center; gap:9px;
    opacity:0; transform:translate(-50%,14px); transition:opacity 1.1s ease, transform 1.1s var(--ease-out); pointer-events:none;}
  #keepsakes.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
  .pill-btn{padding:11px 22px; border-radius:99px; font-size:14px; font-weight:500; color:#fff; white-space:nowrap; cursor:pointer; border:0;}
  #openLetter{font-size:14.5px;}
  #openGallery{font-size:13px; opacity:.92;}

  /* ---------- letter ---------- */

  /* ---------- orbit-star photo card ---------- */
  #orbitHint{position:fixed; left:50%; z-index:11; bottom:max(112px, calc(env(safe-area-inset-bottom) + 104px));
    transform:translate(-50%,8px); opacity:0; transition:opacity 1s ease, transform 1s var(--ease-out); pointer-events:none;
    font-size:12.5px; color:rgba(255,235,244,.85); padding:8px 16px; border-radius:99px; white-space:nowrap;}
  #orbitHint.show{opacity:1; transform:translate(-50%,0);}
  #photoWrap{position:fixed; inset:0; z-index:31; opacity:0; pointer-events:none; transition:opacity .45s ease;}
  #photoWrap.show{opacity:1; pointer-events:auto;}
  #photoVeil{position:absolute; inset:0; background:radial-gradient(120% 100% at 50% 42%, rgba(40,10,32,.28), rgba(8,3,16,.6));}
  #photoCard{position:absolute; left:50%; top:50%; transform:translate(-50%,-46%) scale(.94); width:min(78vw,280px);
    padding:16px 16px 18px; border-radius:28px; text-align:center; transition:transform .55s var(--ease-out);}
  #photoWrap.show #photoCard{transform:translate(-50%,-50%) scale(1);}
  #photoCard img{width:100%; border-radius:20px; display:block; box-shadow:0 14px 30px rgba(60,4,40,.5), inset 0 0 0 1px rgba(255,255,255,.22);}
  #photoCard .cap{margin-top:13px; font-size:15px; color:#fff;}
  #photoClose{position:absolute; top:-14px; right:-14px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff;}
  #photoClose svg{width:14px; height:14px; stroke:#fff; stroke-width:2; fill:none; stroke-linecap:round;}


  #keepsakes{display:none !important;}
  .lstep.env{cursor:pointer;}
  .env3d{position:relative; width:min(62vw,214px); aspect-ratio:1.42; margin-top:34px; perspective:900px; animation:envBob 3.6s ease-in-out infinite;}
  @keyframes envBob{0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-7px) rotate(1.5deg)}}
  .env3d .back{position:absolute; inset:0; border-radius:14px; background:linear-gradient(160deg,#ffd0e6,#ff8fc3); box-shadow:0 18px 40px rgba(90,6,56,.5), 0 0 34px rgba(255,140,200,.45), inset 0 0 0 1px rgba(255,255,255,.55);}
  .env3d .paper{position:absolute; left:9%; right:9%; top:10%; bottom:12%; border-radius:8px; background:linear-gradient(#fffafc,#ffe9f3); box-shadow:0 2px 8px rgba(90,6,56,.25); z-index:1; transition:transform 1s var(--ease-out) .45s;}
  .env3d .front{position:absolute; inset:0; border-radius:14px; z-index:2; background:linear-gradient(200deg,#ffe0ef,#ff9fca); clip-path:polygon(0 100%,0 26%,50% 64%,100% 26%,100% 100%); filter:drop-shadow(0 -1px 0 rgba(255,255,255,.6));}
  .env3d .flap{position:absolute; left:0; right:0; top:0; height:64%; z-index:3; transform-origin:50% 0; background:linear-gradient(#ffc6df,#ff97c6); clip-path:polygon(0 0,100% 0,50% 100%); transition:transform .75s var(--ease-out), z-index 0s .38s;}
  .env3d .seal{position:absolute; left:50%; top:52%; width:19%; aspect-ratio:1; margin:-9.5% 0 0 -9.5%; z-index:4; border-radius:50%; display:grid; place-items:center; font-size:17px; color:#fff;
    background:radial-gradient(circle at 35% 30%,#ffb1d3,#e0387f 62%,#a81f5a); box-shadow:0 3px 10px rgba(120,10,64,.55), inset 0 1px 0 rgba(255,255,255,.5); transition:opacity .4s ease, transform .5s var(--ease-out);}
  .env3d.open .flap{transform:rotateX(180deg); z-index:0;}
  .env3d.open .seal{opacity:0; transform:scale(1.6) translateY(-6px);}
  .env3d.open .paper{transform:translateY(-46%);}
  .env3d.open{animation:none;}
  .env3d .spark{position:absolute; width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 12px 3px rgba(255,190,225,.9); opacity:0; animation:sp 2.4s ease-in-out infinite;}
  @keyframes sp{0%,100%{opacity:0; transform:scale(.3)} 50%{opacity:1; transform:scale(1)}}

  #letterDots,#letterTap{display:none !important;}
  #envStage{position:fixed; inset:0; z-index:29; display:grid; place-items:center; opacity:0; pointer-events:none; transition:opacity .55s ease;}
  #envStage.show{opacity:1;}
  #envStage.show.lift{opacity:0; transition:opacity 1s ease .25s;}
  #envStage .env3d{margin-top:0; width:min(62vw,300px);}
  body.zooming #sound, body.zooming #replay, body.zooming #hint{opacity:0 !important; pointer-events:none !important;}

  /* ---- letter as a sheet of paper, centred ---- */

  /* ---- letter: liquid glass ---- */

  /* ================= letter v2: a glass stationery card with its own little world ================= */
  @property --ang{syntax:'<angle>'; inherits:false; initial-value:0deg;}
  #letterWrap{position:fixed; inset:0; z-index:30; opacity:0; pointer-events:none; transition:opacity .5s ease;}
  #letterWrap.show{opacity:1; pointer-events:auto;}
  #letterVeil{position:absolute; inset:0; background:radial-gradient(120% 100% at 50% 40%, rgba(40,10,36,.42), rgba(8,3,16,.8)); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
  #letterSheet{position:absolute; left:50%; top:50%; width:min(calc(100vw - 20px),470px); height:min(calc(100vh - 28px),720px); height:min(calc(100dvh - 28px),720px);
    display:flex; flex-direction:column; border-radius:34px; overflow:hidden; isolation:isolate; color:#fff;
    background:linear-gradient(180deg,rgba(70,12,64,.34),rgba(96,20,84,.28)), radial-gradient(130% 110% at 15% -8%, rgba(255,214,236,.4), rgba(255,150,200,.14) 48%, rgba(255,110,180,.08));
    -webkit-backdrop-filter:blur(28px) saturate(200%) brightness(1.1); backdrop-filter:blur(28px) saturate(200%) brightness(1.1);
    box-shadow:inset 0 1.5px 0 rgba(255,238,246,.7), inset 0 -1.5px 0 rgba(255,170,215,.22), 0 30px 80px rgba(50,4,40,.6), 0 0 70px rgba(255,120,190,.22);
    opacity:0; transform:translate(-50%,-46%) scale(.86); transition:transform 1s cubic-bezier(.2,1.25,.3,1), opacity .6s ease;}
  #letterWrap.show #letterSheet{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .lbg{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .lbg i{position:absolute; border-radius:50%; filter:blur(40px); opacity:.7; animation:orb 16s ease-in-out infinite alternate;}
  .lbg .o1{width:250px; height:250px; left:-70px; top:-50px; background:#ff6fb0;}
  .lbg .o2{width:210px; height:210px; right:-60px; bottom:-40px; background:#ffbf5e; opacity:.42; animation-duration:19s;}
  .lbg .o3{width:230px; height:230px; right:-90px; top:32%; background:#9d7cff; opacity:.45; animation-duration:22s; animation-delay:-6s;}
  @keyframes orb{0%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,60px) scale(1.15)} 100%{transform:translate(-30px,20px) scale(.92)}}
  #letterFx{position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none;}
  .lrim{position:absolute; inset:0; z-index:7; border-radius:inherit; padding:1.6px; pointer-events:none;
    background:conic-gradient(from var(--ang), rgba(255,255,255,0) 0%, rgba(255,190,225,.95) 12%, rgba(255,255,255,0) 30%, rgba(255,217,138,.85) 55%, rgba(255,255,255,0) 75%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:rimSpin 7s linear infinite;}
  @keyframes rimSpin{to{--ang:360deg}}
  #letterClose{position:absolute; top:14px; right:14px; z-index:8; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:inset 0 1px 0 rgba(255,255,255,.5);}
  #letterClose svg{width:15px; height:15px; stroke:#fff; stroke-width:2; fill:none; stroke-linecap:round;}
  .lhead{position:relative; z-index:3; flex:none; text-align:center; padding:22px 28px 0;}
  .lseal{width:46px; height:46px; margin:0 auto 8px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,143,199,.35)); border:1px solid rgba(255,255,255,.5);
    box-shadow:0 0 26px rgba(255,120,190,.6), inset 0 1px 0 rgba(255,255,255,.7); animation:beat .85s ease-in-out infinite;}
  .lseal svg{width:22px; height:22px; fill:#fff; filter:drop-shadow(0 0 6px rgba(255,90,170,.9));}
  @keyframes beat{0%,100%{transform:scale(1)} 8%{transform:scale(1.14)} 20%{transform:scale(1.02)} 32%{transform:scale(1.1)} 50%{transform:scale(1)}}
  .lchip{display:inline-block; font-size:11.5px; letter-spacing:.06em; padding:4px 12px; border-radius:99px; color:#ffe9f4; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.3);}
  #letterFrom{margin-top:8px; font-family:'Mali',cursive; font-size:25px; font-weight:700; line-height:1.3;
    background:linear-gradient(100deg,#fff 20%,#ffc2e0 40%,#ffe3a8 55%,#fff 75%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    animation:shim 6s linear infinite; filter:drop-shadow(0 2px 14px rgba(255,90,170,.5));}
  @keyframes shim{from{background-position:100% 0} to{background-position:-150% 0}}
  .ldiv{display:flex; align-items:center; gap:10px; margin:10px auto 0; width:70%; color:#ffc2e0; font-size:12px;}
  .ldiv i{flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(255,200,230,.7),transparent);}
  #letterBody{position:relative; z-index:3; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:12px 28px 70px;
    -webkit-mask-image:linear-gradient(transparent 0,#000 20px,#000 calc(100% - 64px),transparent); mask-image:linear-gradient(transparent 0,#000 20px,#000 calc(100% - 64px),transparent);}
  #letterBody::-webkit-scrollbar{display:none;}
  .lp{margin:0; font-family:'Mali',cursive; font-size:17.5px; line-height:1.95; text-indent:1.6em; color:#fff7fb; text-align:left; text-shadow:0 1px 14px rgba(255,110,185,.35);}
  .lphotos{display:flex; justify-content:center; gap:14px; padding:26px 0 18px;}
  .lpol{position:relative; width:44%; max-width:170px; margin:0; padding:6px 6px 22px; background:#fff; border-radius:4px; box-shadow:0 10px 24px rgba(50,4,40,.4); transform:rotate(-3.5deg); animation:polf 6s ease-in-out infinite;}
  .lpol:nth-child(2){transform:rotate(3deg) translateY(8px); animation-delay:-3s;}
  .lpol::before{content:''; position:absolute; top:-9px; left:50%; width:54px; height:17px; transform:translateX(-50%) rotate(-4deg); border-radius:2px; background:repeating-linear-gradient(90deg,rgba(255,150,196,.8) 0 7px,rgba(255,200,225,.8) 7px 14px);}
  .lpol img{display:block; width:100%; border-radius:2px;}
  @keyframes polf{0%,100%{translate:0 0} 50%{translate:0 -5px}}
  .lclose{text-align:center; padding:14px 0 8px; font-family:'Mali',cursive; font-weight:700; font-size:25px; line-height:1.4;
    background:linear-gradient(100deg,#fff 20%,#ffc2e0 40%,#ffe3a8 55%,#fff 75%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; animation:shim 6s linear infinite;}
  .lclose .heart{display:block; margin:6px auto 0; width:50px; height:50px; -webkit-text-fill-color:initial;}
  .lclose .heart svg{width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 10px rgba(255,120,190,.8));}
  .lclose .heart path{fill:rgba(255,143,199,0); stroke:#ffc2e0; stroke-width:1.3; stroke-dasharray:100; stroke-dashoffset:100;}
  #letterWrap.show .lclose .heart path{animation:hdraw 2.2s 1.2s ease forwards, hfill .9s 3.2s ease forwards;}
  #letterWrap.show .lclose .heart{animation:beat .85s 4s ease-in-out infinite;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

const rnd = Math.random;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

const stage = document.getElementById('stage');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 400);
let camDist=18.2, camTheta=0.4, camPhi=1.38;
let landMix=0;      /* 1 = the opening view (looking up at the sky), 0 = the normal orbit view */
const camTarget = new THREE.Vector3(0,1.6,0);

scene.add(islandGroup);

const camTmp=new THREE.Vector3(), tgtTmp=new THREE.Vector3();
function updateCamera(){
  camPhi=Math.max(0.55,Math.min(1.5,camPhi));
  camDist=Math.max(7,Math.min(24,camDist));
  camTmp.set(
    camTarget.x+camDist*Math.sin(camPhi)*Math.sin(camTheta),
    camTarget.y+camDist*Math.cos(camPhi),
    camTarget.z+camDist*Math.sin(camPhi)*Math.cos(camTheta)

  if(landMix>0.0001){
    camera.position.lerpVectors(camTmp,LAND_POS,landMix);
    tgtTmp.lerpVectors(camTarget,LAND_TGT,landMix);
    const px=(par.x+par.sx)*landMix, py=(par.y+par.sy)*landMix;   /* gentle parallax: the heart drifts a little against the sky */
    camera.position.x+=px; camera.position.y+=py; tgtTmp.x+=px; tgtTmp.y+=py;

moonLight.position.set(-6,14,8);
scene.add(moonLight);
const warmLight = new THREE.PointLight(0xf3c46a, 0.4, 30);
warmLight.position.set(3,6,4);
scene.add(warmLight);

const canopyLight = new THREE.PointLight(0xff8fc0, 0, 30);
canopyLight.position.set(0,6.2,0);
islandGroup.add(canopyLight);

const underLight = new THREE.PointLight(0x9a7bff, 1.7, 22);
underLight.position.set(0.6,-7,2.2);
islandGroup.add(underLight);

function glowTexture(hex){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,hex+'ff'); g.addColorStop(0.35,hex+'cc'); g.addColorStop(1,hex+'00');

}
const tmpCol = new THREE.Color();

/* ================= star shader =================

const starMats = [];
const STAR_VS = `
attribute vec3 aColor;
attribute float aSeed;
#ifdef USE_BIRTH
attribute float aBirth;
#endif
uniform float uTime;
uniform float uSize;
uniform float uScale;
uniform float uTw;
#ifdef USE_SWAY
uniform vec3 uCenter;
uniform float uSwayY;
#endif
varying vec3 vColor;
varying float vAlpha;
void main(){
  vec3 P = position;
  #ifdef USE_SWAY
  float hs = clamp((P.y - uSwayY)/2.6, 0.0, 1.0);
  P.x += sin(uTime*0.55 + P.y*0.9 + P.z*0.4)*0.07*hs;
  P.z += cos(uTime*0.47 + P.y*0.8 + P.x*0.4)*0.06*hs;
  P = uCenter + (P - uCenter)*(1.0 + 0.016*sin(uTime*0.85));
  #endif
  vec4 mv = modelViewMatrix * vec4(P,1.0);
  float ph = aSeed*61.8;
  float sp = 0.7 + fract(aSeed*7.13)*2.6;
  float tw = 1.0 - uTw*(0.5 - 0.5*sin(uTime*sp + ph));
  float sz = 0.55 + fract(aSeed*3.71)*0.95;
  float fade = 1.0;
  #ifdef USE_BIRTH
  fade = smoothstep(0.0, 1.6, uTime - aBirth);
  #endif
  vColor = aColor;
  vAlpha = tw*fade;
  gl_PointSize = uSize*sz*(0.8+0.2*tw)*fade*uScale/(-mv.z);
  gl_Position = projectionMatrix * mv;
}`;
const STAR_FS = `
uniform float uOpacity;
uniform float uSparkle;
varying vec3 vColor;
varying float vAlpha;
void main(){
  vec2 p = (gl_PointCoord - 0.5)*2.0;
  float r2 = dot(p,p);
  if(r2 > 1.0) discard;
  float a;
  if(uSparkle > 0.5){
    float core = exp(-r2*16.0);
    float h = exp(-abs(p.y)*28.0)*(1.0-abs(p.x));
    float v = exp(-abs(p.x)*28.0)*(1.0-abs(p.y));
    a = clamp(core + 0.9*(h+v), 0.0, 1.0);
  } else {
    a = pow(1.0 - sqrt(r2), 1.8);
  }

}`;
function makeStarMat(o){
  const m = new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0},
      uSize:{value:o.size*renderer.getPixelRatio()},
      uScale:{value:innerHeight*0.5},
      uTw:{value:o.tw===undefined?0.3:o.tw},
      uOpacity:{value:o.opacity===undefined?1:o.opacity},
      uSparkle:{value:o.sparkle?1:0},
      uCenter:{value:new THREE.Vector3()},
      uSwayY:{value:0}
    },
    vertexShader:STAR_VS, fragmentShader:STAR_FS,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending

  if(Object.keys(defs).length) m.defines=defs;
  m.userData.baseSize = o.size;
  starMats.push(m);
  return m;
}
/* builds a Points object from flat arrays (colors are plain display colors — shader outputs them as-is) */
function makeStarPoints(pos, col, seed, mat, extra){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  if(extra) for(const k in extra) g.setAttribute(k, extra[k]);
  const p = new THREE.Points(g, mat);
  p.frustumCulled = false;
  return p;
}

/* ================= sky: nebula + milky way (painted once, wraps the whole scene) ================= */
const SKY_X0=0.813;                    /* where the milky way crosses the opening view */
const skyBandV = u => (640 - Math.sin(2*Math.PI*(u-SKY_X0))*230)/1024;
function skyTexture(){
  /* the soft parts (nebula, milky way) are computed per pixel from noise on a small grid,
     then stretched up smoothly; stars are added crisp on top */
  const w=512, h=256;
  const small=document.createElement('canvas'); small.width=w; small.height=h;
  const sctx=small.getContext('2d');
  const img=sctx.createImageData(w,h), d=img.data;
  const SEED=(rnd()*1e6)|0;
  function hash2(x,y){
    let k=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(SEED,144665);
    k=Math.imul(k^(k>>>13),1274126177); k^=k>>>16;
    return (k>>>0)/4294967295;
  }
  function vnoise(x,y,px){
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    const x0=((xi%px)+px)%px, x1=(x0+1)%px;
    const a=hash2(x0,yi), b=hash2(x1,yi), c=hash2(x0,yi+1), e=hash2(x1,yi+1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+e)*u*v;
  }
  function fbm(u,v,cells){            /* u wraps around 0..1 so the sky has no seam */
    let s=0,a=0.5,f=1,norm=0;
    for(let o=0;o<4;o++){ const px=cells*f; s+=a*vnoise(u*px,v*f,px); norm+=a; a*=0.5; f*=2; }
    return s/norm;
  }
  const sm=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
  const bandV = skyBandV;
  for(let y=0;y<h;y++){
    const v=y/h;
    const mask=Math.exp(-Math.pow((v-0.6)/0.3,2));
    for(let x=0;x<w;x++){
      const u=x/w;
      /* deep base, slightly lighter towards the middle latitudes */
      let r=4+4*mask, g=3+2*mask, b=11+9*mask;
      const n1=fbm(u,v*2.6,3), n2=fbm(u+0.31,v*3.1+4,4), n3=fbm(u+0.62,v*2.2+9,3);
      const a1=Math.pow(sm(0.44,0.82,n1),1.3)*mask;
      const a2=sm(0.52,0.86,n2)*mask;
      const a3=sm(0.56,0.86,n3)*mask;
      r+=70*a1*0.42+150*a2*0.32+25*a3*0.2;
      g+=38*a1*0.42+36*a2*0.32+95*a3*0.2;
      b+=170*a1*0.42+105*a2*0.32+140*a3*0.2;
      /* milky way band with mottled glow and dark dust lanes */
      const dv=(v-bandV(u))/0.085;
      const mott=0.35+0.65*fbm(u*1.0,v*7+2,10);
      const band=Math.exp(-dv*dv)*mott;
      const core=Math.exp(-dv*dv*4.5)*(0.4+0.6*fbm(u,v*11+5,14));
      r+=190*band*0.3+255*core*0.16;
      g+=178*band*0.3+205*core*0.16;
      b+=225*band*0.3+225*core*0.16;
      const lane=Math.exp(-Math.pow((v-bandV(u)-0.012)/0.014,2))*sm(0.45,0.72,fbm(u,v*15+7,16));
      const k=1-0.65*lane;
      const i=(y*w+x)*4;
      d[i]=clamp(r*k,0,255); d[i+1]=clamp(g*k,0,255); d[i+2]=clamp(b*k,0,255); d[i+3]=255;
    }
  }
  sctx.putImageData(img,0,0);

  const W=2048, H=1024;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(small,0,0,W,H);
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  return t;
}
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180,48,32),
  new THREE.MeshBasicMaterial({map:skyTexture(), side:THREE.BackSide, fog:false, depthWrite:false})
);
sky.renderOrder = -10;
const skyRot = new THREE.Group();   /* sky + stars tilt together during the opening */
scene.add(skyRot);
skyRot.add(sky);

/* ================= distant worlds: the planet this fragment broke off from, and a moon ================= */
function makeNoise(){
  const SEED=(rnd()*1e6)|0;
  function hash2(x,y){
    let k=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(SEED,144665);
    k=Math.imul(k^(k>>>13),1274126177); k^=k>>>16;
    return (k>>>0)/4294967295;
  }
  function vnoise(x,y,px){
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    const x0=((xi%px)+px)%px, x1=(x0+1)%px;
    const a=hash2(x0,yi), b=hash2(x1,yi), c=hash2(x0,yi+1), e=hash2(x1,yi+1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+e)*u*v;
  }
  function fbm(u,v,cells,oct){
    let s=0,a=0.5,f=1,norm=0;
    for(let o=0;o<oct;o++){ const px=cells*f; s+=a*vnoise(u*px,v*f,px); norm+=a; a*=0.5; f*=2; }
    return s/norm;
  }
  return {fbm};
}
const PL_VS=`
varying vec3 vN; varying vec3 vW; varying vec2 vUv;
void main(){
  vUv=uv; vN=normalize(mat3(modelMatrix)*normal);
  vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz;
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const PL_FS=`
uniform sampler2D uMap; uniform vec3 uSun; uniform vec3 uRim; uniform float uAmb; uniform float uRimPow;
varying vec3 vN; varying vec3 vW; varying vec2 vUv;
void main(){
  vec3 N=normalize(vN); vec3 V=normalize(cameraPosition-vW); vec3 L=normalize(uSun);
  float ndl=dot(N,L);
  float lit=uAmb+(1.0-uAmb)*smoothstep(-0.05,0.7,ndl);
  vec3 col=texture2D(uMap,vUv).rgb*lit;
  float f=pow(1.0-max(dot(N,V),0.0),uRimPow);
  col+=uRim*f*(0.3+0.7*smoothstep(-0.3,0.6,ndl));
  gl_FragColor=vec4(col,1.0);
}`;
function makePlanetMat(tex,o){
  return new THREE.ShaderMaterial({

/* dark violet rock with rivers of glowing pink and gold light — the same light that leaks out of the fragment */
function planetTexture(){
  const w=640, h=320;
  const sm=document.createElement('canvas'); sm.width=w; sm.height=h;
  const sctx=sm.getContext('2d');
  const img=sctx.createImageData(w,h), d=img.data;
  const nz=makeNoise();
  const ss=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
  for(let y=0;y<h;y++){
    const v=y/h;
    for(let x=0;x<w;x++){
      const u=x/w;
      const n1=nz.fbm(u,v*2,12,5), n2=nz.fbm(u+0.37,v*2+5,22,4), n3=nz.fbm(u+0.71,v*2+11,7,3);
      const t=ss(0.3,0.72,n1);
      let r=20+46*t, g=15+34*t, b=48+66*t;
      const rid=1-Math.abs(2*n2-1);
      const vein=Math.pow(rid,44)*ss(0.36,0.60,n3);
      const wm=ss(0.35,0.65,n3);
      r+=235*vein; g+=(80+95*wm)*vein; b+=(135-70*wm)*vein;
      const halo=Math.pow(rid,8)*0.07*ss(0.4,0.7,n3);
      r+=200*halo; g+=70*halo; b+=140*halo;
      const i=(y*w+x)*4;
      d[i]=clamp(r,0,255); d[i+1]=clamp(g,0,255); d[i+2]=clamp(b,0,255); d[i+3]=255;
    }
  }
  sctx.putImageData(img,0,0);
  const c=document.createElement('canvas'); c.width=2048; c.height=1024;
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(sm,0,0,2048,1024);
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

/* ================= ground: a fragment torn off a planet =================
   flat-ish top (kept), ragged outline, deep faceted rock underneath with glowing cracks */
const GR_R=5.0, GR_N=48, TOP_Y=0.02;
const SEEDG=rnd()*100;
const H1=(i,k)=>{ const s=Math.sin(i*127.1+k*311.7+SEEDG)*43758.5453; return s-Math.floor(s); };

/* ragged outline: slow lobes + small torn steps + a few bites and tongues */
const OUT=new Float32Array(GR_N);
{
  const bites=[], tongues=[];
  for(let j=0;j<5;j++) bites.push({a:rnd()*Math.PI*2, w:0.14+rnd()*0.16, d:0.07+rnd()*0.11});
  for(let j=0;j<3;j++) tongues.push({a:rnd()*Math.PI*2, w:0.16+rnd()*0.12, d:0.06+rnd()*0.07});
  const wrapD=(a,b)=>{ const d=Math.abs(a-b); return Math.min(d,Math.PI*2-d); };
  for(let i=0;i<GR_N;i++){
    const a=i/GR_N*Math.PI*2;
    let n=1+Math.sin(a*3+SEEDG)*0.09+Math.sin(a*5+2.0+SEEDG)*0.06+Math.sin(a*8+1.3)*0.035;
    n*=1+(H1(i,0)-0.5)*0.09;
    bites.forEach(b=>{ const d=wrapD(a,b.a)/b.w; n*=1-b.d*Math.exp(-d*d); });
    tongues.forEach(b=>{ const d=wrapD(a,b.a)/b.w; n*=1+b.d*Math.exp(-d*d); });
    OUT[i]=GR_R*n;
  }
}
function outlineR(a){
  const f=(((a/(Math.PI*2))%1)+1)%1*GR_N;
  const i0=Math.floor(f)%GR_N, i1=(i0+1)%GR_N, t=f-Math.floor(f);
  return OUT[i0]*(1-t)+OUT[i1]*t;
}

/* every triangle gets wound the right way (up for the top, away from a reference point for the rock) */
function orientTris(pos, idx, test){
  for(let t=0;t<idx.length;t+=3){
    const a=idx[t]*3, b=idx[t+1]*3, c=idx[t+2]*3;
    const ux=pos[b]-pos[a], uy=pos[b+1]-pos[a+1], uz=pos[b+2]-pos[a+2];
    const vx=pos[c]-pos[a], vy=pos[c+1]-pos[a+1], vz=pos[c+2]-pos[a+2];
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const cx=(pos[a]+pos[b]+pos[c])/3, cy=(pos[a+1]+pos[b+1]+pos[c+1])/3, cz=(pos[a+2]+pos[b+2]+pos[c+2])/3;
    if(test(nx,ny,nz,cx,cy,cz)<0){ const tmp=idx[t+1]; idx[t+1]=idx[t+2]; idx[t+2]=tmp; }
  }
}
function makeGeo(pos, uv, idx){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---- top surface (flat around the tree, torn and slightly lifted at the very edge) ---- */
function topRimY(i){ return TOP_Y+(H1(i,7)-0.5)*0.09; }
function topPoint(i,u){
  const a=i/GR_N*Math.PI*2, w=u*u;
  const r=u*(GR_R*(1-w)+OUT[i]*w);
  let y=TOP_Y;
  if(u>=0.99) y=topRimY(i); else if(u>=0.89) y=TOP_Y+(H1(i,5)-0.5)*0.05;
  return new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r);
}
{
  const pos=[0,TOP_Y,0], uv=[0.5,0.5], idx=[];
  const rings=[0.42,0.72,0.9,1.0], S=GR_R*2.7;
  rings.forEach(u=>{ for(let i=0;i<GR_N;i++){ const p=topPoint(i,u); pos.push(p.x,p.y,p.z); uv.push(0.5+p.x/S,0.5+p.z/S); } });
  const at=(k,i)=>1+k*GR_N+(i%GR_N);
  for(let i=0;i<GR_N;i++) idx.push(0,at(0,i+1),at(0,i));
  for(let k=0;k<rings.length-1;k++) for(let i=0;i<GR_N;i++){
    idx.push(at(k,i),at(k+1,i+1),at(k+1,i));
    idx.push(at(k,i),at(k,i+1),at(k+1,i+1));
  }
  orientTris(pos,idx,(nx,ny)=>ny);
  const top=new THREE.Mesh(makeGeo(pos,uv,idx), new THREE.MeshStandardMaterial({map:moonTopTexture(), roughness:1}));
  moonGroundGroup.add(top);
}

/* ---- underside: a deep, faceted, tapering chunk of rock with one big spike and a few small ones ---- */
const UR=[{u:1.0,dy:0},{u:0.985,dy:-0.3},{u:0.9,dy:-0.95},{u:0.74,dy:-1.8},{u:0.56,dy:-2.7},{u:0.4,dy:-3.5},{u:0.25,dy:-4.3},{u:0.12,dy:-4.9}];
const APEX=new THREE.Vector3(0.3,-5.9,-0.2);
const spikes=[];
for(let j=0;j<3;j++){
  const a=(j/3)*Math.PI*2+rnd()*1.2, r=GR_R*(0.42+rnd()*0.2);
  spikes.push({x:Math.cos(a)*r, z:Math.sin(a)*r, e:0.9+rnd()*0.8, w:0.6+rnd()*0.3});
}
const grid=[];
{
  UR.forEach((row,k)=>{
    const ring=[];
    for(let i=0;i<=GR_N;i++){
      const ii=i%GR_N, a=ii/GR_N*Math.PI*2, w=row.u*row.u;
      let r=row.u*(GR_R*(1-w)+OUT[ii]*w), y;
      if(k===0) y=topRimY(ii);
      else {
        r*=1+(H1(ii,k)-0.5)*(k===1?0.04:0.2);
        y=TOP_Y+row.dy+(H1(ii,k+20)-0.5)*(k===1?0.1:0.42);
      }
      const x=Math.cos(a)*r, z=Math.sin(a)*r;
      if(k>=3) spikes.forEach(s=>{ const d2=(x-s.x)*(x-s.x)+(z-s.z)*(z-s.z); y-=s.e*Math.exp(-d2/(2*s.w*s.w)); });
      ring.push(new THREE.Vector3(x,y,z));
    }
    grid.push(ring);
  });
  /* keep every column tapering downward (no folded faces), and keep the big spike the deepest point */
  for(let i=0;i<=GR_N;i++) for(let k=1;k<UR.length;k++){
    const above=grid[k-1][i].y-0.15;
    if(grid[k][i].y>above) grid[k][i].y=above;
  }
  { let lo=0; grid[UR.length-1].forEach(v=>{ lo=Math.min(lo,v.y); }); if(lo-0.4<APEX.y) APEX.y=lo-0.4; }
  const pos=[], uv=[], idx=[];
  const W1=GR_N+1, K=UR.length;
  grid.forEach(ring=>ring.forEach((v,i)=>{
    pos.push(v.x,v.y,v.z);
    uv.push(i/GR_N, clamp(1+(v.y-TOP_Y)*0.2,0.02,1));
  }));
  const apexBase=pos.length/3;
  for(let i=0;i<GR_N;i++){ pos.push(APEX.x,APEX.y,APEX.z); uv.push((i+0.5)/GR_N,0.02); }
  for(let k=0;k<K-1;k++) for(let i=0;i<GR_N;i++){
    const a0=k*W1+i, a1=a0+1, b0=(k+1)*W1+i, b1=b0+1;
    idx.push(a0,b0,b1, a0,b1,a1);
  }
  for(let i=0;i<GR_N;i++){
    const a0=(K-1)*W1+i;
    idx.push(a0,a0+1,apexBase+i);
  }
  orientTris(pos,idx,(nx,ny,nz,cx,cy,cz)=>nx*cx+ny*(cy-(TOP_Y-2.2))+nz*cz);
  const under=new THREE.Mesh(makeGeo(pos,uv,idx), new THREE.MeshStandardMaterial({map:underTexture(), roughness:1, flatShading:true, side:THREE.DoubleSide}));
  moonGroundGroup.add(under);
}

/* ---- star-light leaking out of cracks in the rock ---- */
const warm=[new THREE.Color('#ffc978'),new THREE.Color('#ff7fb4'),new THREE.Color('#ffa06a'),new THREE.Color('#c48bff')];
const crackMat = makeStarMat({size:0.13, opacity:0, tw:0.8});
let crackLine;
{
  const cPos=[], cCol=[], cSeed=[], seg=[];
  const outward=v=>{ const r=Math.max(0.6,Math.hypot(v.x,v.z)); return new THREE.Vector3(v.x/r,-0.35,v.z/r).normalize().multiplyScalar(0.05); };
  for(let c=0;c<11;c++){
    let k=Math.floor(rnd()*3), i=Math.floor(rnd()*GR_N), guard=0;
    const kEnd=Math.min(UR.length-1,k+3+Math.floor(rnd()*4));
    const pts=[];
    while(k<=kEnd && guard++<40){
      pts.push(grid[k][i].clone().add(outward(grid[k][i])));
      const s=rnd();
      if(s<0.6) k++;
      if(s>0.3) i=(i+(rnd()<0.5?-1:1)+GR_N)%GR_N;
    }
    const col=warm[c%warm.length];
    for(let j=0;j<pts.length-1;j++){
      const p=pts[j], q=pts[j+1];
      seg.push(p.x,p.y,p.z,q.x,q.y,q.z);
      const n=Math.max(3,Math.ceil(p.distanceTo(q)*30));
      for(let m=0;m<n;m++){
        const f=m/n, b=0.6+rnd()*0.7;
        cPos.push(p.x+(q.x-p.x)*f+(rnd()-0.5)*0.05, p.y+(q.y-p.y)*f+(rnd()-0.5)*0.05, p.z+(q.z-p.z)*f+(rnd()-0.5)*0.05);
        cCol.push(col.r*b,col.g*b,col.b*b); cSeed.push(rnd());
      }
    }
  }
  islandGroup.add(makeStarPoints(new Float32Array(cPos),new Float32Array(cCol),new Float32Array(cSeed),crackMat));
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(seg,3));
  crackLine=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xff5f9e, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
  islandGroup.add(crackLine);
}

/* ---- star dust dripping from the tips of the spikes ---- */
const tips=[APEX.clone()];
{
  let best=null;
  for(let k=4;k<grid.length;k++) for(let i=0;i<GR_N;i++){
    const v=grid[k][i];
    if(Math.hypot(v.x-APEX.x,v.z-APEX.z)>1.3 && (!best||v.y<best.y)) best=v;

const DRIP_N=90;
const drPos=new Float32Array(DRIP_N*3), drCol=new Float32Array(DRIP_N*3), drSeed=new Float32Array(DRIP_N);
const drBase=new Float32Array(DRIP_N*3), drAge=new Float32Array(DRIP_N), drLife=new Float32Array(DRIP_N), drVy=new Float32Array(DRIP_N);
function respawnDrip(i){
  const t=tips[(rnd()<0.7||tips.length<2)?0:1];
  drPos[i*3]=t.x+(rnd()-0.5)*0.12; drPos[i*3+1]=t.y-0.02; drPos[i*3+2]=t.z+(rnd()-0.5)*0.12;

  const c=warm[(rnd()*3)|0], b=0.7+rnd()*0.5;
  drBase[i*3]=c.r*b; drBase[i*3+1]=c.g*b; drBase[i*3+2]=c.b*b;
}

function updateDrip(dt){
  for(let i=0;i<DRIP_N;i++){
    drAge[i]+=dt;
    if(drAge[i]>=drLife[i]) respawnDrip(i);
    drPos[i*3+1]-=drVy[i]*dt;
    drPos[i*3]+=Math.sin(elapsed*0.8+i)*0.03*dt;
    const u=drAge[i]/drLife[i], f=Math.min(1,drAge[i]/0.35)*Math.pow(1-u,1.2);
    drCol[i*3]=drBase[i*3]*f; drCol[i*3+1]=drBase[i*3+1]*f; drCol[i*3+2]=drBase[i*3+2]*f;
  }
  dripPts.geometry.attributes.position.needsUpdate=true;

}

/* ---- limb sampler: scatters tiny points around a curved tapered tube ---- */
function sampleLimbStars(curve, r0, r1, count, out, colorFn){
  const worldUp = new THREE.Vector3(0,1,0);
  for(let i=0;i<count;i++){
    const u = rnd();
    const baseR = r0+(r1-r0)*Math.pow(u,0.85);
    const rad = baseR*Math.sqrt(rnd())*1.05;
    const angle = rnd()*Math.PI*2;
    const pt = curve.getPointAt(u);
    const tangent = curve.getTangentAt(u);
    let normal = new THREE.Vector3().crossVectors(tangent, worldUp);
    if(normal.lengthSq()<0.0008) normal.set(1,0,0.3);
    normal.normalize();
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    const p = pt.clone().addScaledVector(normal, rad*Math.cos(angle)).addScaledVector(binormal, rad*Math.sin(angle));
    const col = colorFn();
    out.push({x:p.x,y:p.y,z:p.z,r:col.r,g:col.g,b:col.b});
  }
}

/* Points sorted bottom-to-top, revealed with a growing drawRange so the tree fills upward */
function buildSortedSwarm(items, targetSize){
  items.sort((a,b)=>a.y-b.y);
  const n = items.length;
  const positions = new Float32Array(n*3);
  const colors = new Float32Array(n*3);
  const seeds = new Float32Array(n);
  for(let i=0;i<n;i++){
    positions[i*3]=items[i].x; positions[i*3+1]=items[i].y; positions[i*3+2]=items[i].z;
    colors[i*3]=items[i].r; colors[i*3+1]=items[i].g; colors[i*3+2]=items[i].b;
    seeds[i]=rnd();
  }
  const mat = makeStarMat({size:targetSize, opacity:0, tw:0.3});
  const pts = makeStarPoints(positions, colors, seeds, mat);
  pts.geometry.setDrawRange(0,0);
  return {pts, mat, total:n};
}
const woodSwarms = [];
function makeLimbSwarm(limbs, starsPerUnit, delay, dur, targetSize, targetOpacity){
  const items=[];
  limbs.forEach(({curve,r0,r1})=>{
    const len = curve.getLength();
    const count = Math.max(24, Math.round(len*starsPerUnit));
    sampleLimbStars(curve, r0, r1, count, items, woodStarColor);
  });
  const built = buildSortedSwarm(items, targetSize);
  treeGroup.add(built.pts);
  woodSwarms.push({points:built.pts, mat:built.mat, total:built.total, delay, dur, targetOpacity});
  return built.pts;
}

/* ---- hierarchical branches (more upright than before, so they climb into a dome) ---- */
const branchTips = [];
const levelLimbs = [[],[],[]];
function growBranch(start, dir, len, r0, r1, level, maxLevel, out, chain){
  const perp = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));
  if(perp.lengthSq()<0.0008) perp.set(1,0,0.3);
  perp.normalize();
  const bend=(rnd()-0.5)*len*0.45;
  const mid1=start.clone().addScaledVector(dir,len*0.32).addScaledVector(perp,bend*0.55).add(new THREE.Vector3(0,len*0.04,0));
  const mid2=start.clone().addScaledVector(dir,len*0.68).addScaledVector(perp,-bend*0.35).add(new THREE.Vector3(0,len*0.1,0));
  const end=start.clone().addScaledVector(dir,len);
  const curve=new THREE.CatmullRomCurve3([start,mid1,mid2,end]);
  levelLimbs[level].push({curve, r0, r1});
  const myChain = chain.concat([curve]);

  if(level>=maxLevel){ out.push({point:end, radius:r1, chain:myChain}); return; }
  for(let i=0;i<2;i++){
    const spread=0.5+rnd()*0.35;
    const sign=i%2===0?1:-1;
    const axis=new THREE.Vector3((rnd()-0.5),1,(rnd()-0.5)).normalize();
    const childDir=dir.clone().applyAxisAngle(axis, sign*spread);
    childDir.y += 0.08+rnd()*0.1;
    childDir.normalize();
    const childLen=len*(0.6+rnd()*0.15);
    const childR0=r1*0.88, childR1=childR0*(0.45+rnd()*0.15);
    growBranch(end, childDir, childLen, childR0, childR1, level+1, maxLevel, out, myChain);
  }
}

const clumps = [];
{
  const Rc=dome.R-1.0, Ryc=dome.Ry-0.7, PHI_MAX=1.85;
  const cosMax=Math.cos(PHI_MAX);
  let sum=0;
  for(let i=0;i<96;i++){
    const th=rnd()*Math.PI*2;
    const cph=1-rnd()*(1-cosMax);
    const sph=Math.sqrt(1-cph*cph);
    const rho=0.6+rnd()*0.4;
    const rc=0.75+rnd()*0.55;
    clumps.push({
      center:new THREE.Vector3(Rc*rho*sph*Math.cos(th), dome.cy+Ryc*rho*cph, Rc*rho*sph*Math.sin(th)),
      rx:rc, ry:rc*0.85, rz:rc, weight:rc*rc, core:false,
      tone:0.7+rnd()*0.5+0.3*(rho-0.6)/0.4
    });
    sum+=rc*rc;
  }
  /* a thick rim of clumps whose stars hug their outer surface, so the edge of the crown stays full */
  for(let i=0;i<30;i++){
    const th=(i/30)*Math.PI*2+rnd()*0.2;
    const cph=-0.12+rnd()*0.62;
    const sph=Math.sqrt(1-cph*cph);
    const rho=1.0+rnd()*0.06;
    const rc=0.65+rnd()*0.3;
    clumps.push({
      center:new THREE.Vector3(Rc*rho*sph*Math.cos(th), dome.cy+Ryc*rho*cph, Rc*rho*sph*Math.sin(th)),
      rx:rc, ry:rc*0.85, rz:rc, weight:rc*rc*1.5, core:false, rim:true,
      tone:1.0+rnd()*0.3
    });
  }
  /* a soft fill through the middle so the dome never looks hollow */
  clumps.push({center:new THREE.Vector3(0,dome.cy-0.15,0), rx:Rc*0.9, ry:Ryc*0.85, rz:Rc*0.9, weight:sum*0.3, core:true, tone:0.85});
}
const cumW=[]; let totalW=0;
clumps.forEach(c=>{ totalW+=c.weight; cumW.push(totalW); });
function pickClump(){
  const r=rnd()*totalW; let lo=0, hi=cumW.length-1;
  while(lo<hi){ const m=(lo+hi)>>1; if(cumW[m]<r) lo=m+1; else hi=m; }
  return clumps[lo];
}
function pointInClump(c){
  const th=rnd()*Math.PI*2, ph=Math.acos(2*rnd()-1);
  const rad = c.core ? Math.cbrt(rnd()) : (c.rim ? Math.pow(rnd(),0.34) : Math.pow(rnd(),0.5));
  const v=new THREE.Vector3(
    c.center.x + c.rx*rad*Math.sin(ph)*Math.cos(th),
    c.center.y + c.ry*rad*Math.cos(ph),
    c.center.z + c.rz*rad*Math.sin(ph)*Math.sin(th)
  );
  v.tone=c.tone;
  return v;
}

/* sunset-galaxy gradient: violet at the base → hot pink → peach-gold at the crown */
const C_STOPS=[[0,new THREE.Color('#5f6dff')],[0.26,new THREE.Color('#9a5cff')],[0.5,new THREE.Color('#ff4fa3')],[0.76,new THREE.Color('#ff8a66')],[1,new THREE.Color('#ffd070')]];
const C_BLUE=new THREE.Color('#9fd8ff');
function canopyHue(p, out){
  const yb=dome.cy-dome.Ry*0.75, yt=dome.cy+dome.Ry;
  const hn=clamp((p.y-yb)/(yt-yb),0,1);
  const rn=clamp(Math.hypot(p.x,p.z)/dome.R,0,1);
  const t=clamp(0.5*hn+0.5*(1-Math.pow(rn,1.25))+(rnd()-0.5)*0.16,0,1);
  for(let i=1;i<C_STOPS.length;i++){
    if(t<=C_STOPS[i][0]){
      const a=C_STOPS[i-1], c=C_STOPS[i];
      out.copy(a[1]).lerp(c[1],(t-a[0])/(c[0]-a[0]));
      break;
    }
  }
  if(rnd()<0.05) out.copy(C_BLUE);
  return out;
}

/* Points sorted by distance from where the branches open, so the dome blooms outward */
function buildCanopy(N, colorFn, mat){
  const items=new Array(N);
  for(let i=0;i<N;i++){
    const p=pointInClump(pickClump());
    const c=colorFn(p);
    items[i]={x:p.x,y:p.y,z:p.z,r:c.r,g:c.g,b:c.b,k:Math.hypot(p.x,p.y-trunkEnd.y,p.z)};
  }
  items.sort((a,b)=>a.k-b.k);
  const pos=new Float32Array(N*3), col=new Float32Array(N*3), seed=new Float32Array(N);
  for(let i=0;i<N;i++){
    const it=items[i];
    pos[i*3]=it.x; pos[i*3+1]=it.y; pos[i*3+2]=it.z;
    col[i*3]=it.r; col[i*3+1]=it.g; col[i*3+2]=it.b;
    seed[i]=rnd();
  }
  const pts=makeStarPoints(pos,col,seed,mat);
  pts.geometry.setDrawRange(0,0);
  pts.userData.total=N;
  treeGroup.add(pts);
  return pts;
}

    const ax=Math.cos(th)*rr, az=Math.sin(th)*rr, ay=dome.cy+Ryc*cph-0.3;
    const len=Math.max(0.35,Math.min(0.55+rnd()*1.05, ay-0.5));
    const o=0.1+rnd()*0.22;
    strands.push({ax,ay,az,len,ox:Math.cos(th)*o,oz:Math.sin(th)*o,ph:rnd()*6.28,amp:0.05+rnd()*0.06});
    canopyHue({x:ax,y:ay,z:az},base);
    for(let j=0;j<STRAND_PTS;j++){
      const k=i*STRAND_PTS+j, u=j/(STRAND_PTS-1);
      stPos[k*3]=ax; stPos[k*3+1]=ay-len*u; stPos[k*3+2]=az;
      tmpCol.copy(base).lerp(warm,u*0.55).multiplyScalar(1.25*(1.2-0.6*u)*(j===STRAND_PTS-1?1.7:1));
      stCol[k*3]=tmpCol.r; stCol[k*3+1]=tmpCol.g; stCol[k*3+2]=tmpCol.b;
      stSeed[k]=rnd();
    }
  }
}
const strandMat = makeStarMat({size:0.115, opacity:0, tw:0.8});
const strandPts = makeStarPoints(stPos, stCol, stSeed, strandMat);
strandPts.geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
treeGroup.add(strandPts);
function updateStrands(){
  let k=0;
  for(const s of strands){
    for(let j=0;j<STRAND_PTS;j++,k++){
      const u=j/(STRAND_PTS-1);
      const a=Math.sin(elapsed*0.7+s.ph+u*1.8)*s.amp*u*1.5+Math.sin(elapsed*1.3+s.ph*2+u*3.1)*s.amp*0.3*u;
      const b=Math.cos(elapsed*0.6+s.ph+u*1.5)*s.amp*u;
      stPos[k*3]  =s.ax+s.ox*u*u+a;
      stPos[k*3+1]=s.ay-s.len*u;
      stPos[k*3+2]=s.az+s.oz*u*u+b;
    }
  }
  strandPts.geometry.attributes.position.needsUpdate=true;
}

/* ================= flowing light: sap made of stars, running from the roots up into the canopy ================= */
function sampleCurveInto(curve, reverse, out){
  const n=Math.max(5,Math.ceil(curve.getLength()*14));
  for(let k=0;k<=n;k++){
    const u=reverse?1-k/n:k/n;
    const p=curve.getPointAt(u);
    out.push(p.x,p.y,p.z);
  }
}
const sapChains = branchTips.map((tip,i)=>{
  const arr=[];
  sampleCurveInto(rootLimbs[i%rootLimbs.length].curve, true, arr);
  sampleCurveInto(trunkCurve, false, arr);
  tip.chain.forEach(cv=>sampleCurveInto(cv,false,arr));
  return Float32Array.from(arr);
});
const SAP_N=800, SAP_OP=0.95;
const sapPos=new Float32Array(SAP_N*3), sapCol=new Float32Array(SAP_N*3), sapSeed=new Float32Array(SAP_N);
const sapS=new Float32Array(SAP_N), sapV=new Float32Array(SAP_N), sapC=new Uint16Array(SAP_N), sapOff=new Float32Array(SAP_N*3);
for(let i=0;i<SAP_N;i++){
  sapS[i]=rnd(); sapV[i]=0.05+rnd()*0.06; sapC[i]=Math.floor(rnd()*sapChains.length); sapSeed[i]=rnd();
  const v=new THREE.Vector3(rnd()-0.5,rnd()-0.5,rnd()-0.5).normalize().multiplyScalar(0.04+rnd()*0.12);
  sapOff[i*3]=v.x; sapOff[i*3+1]=v.y; sapOff[i*3+2]=v.z;
}
const sapMat = makeStarMat({size:0.11, opacity:0, tw:0.5});
const sapPts = makeStarPoints(sapPos, sapCol, sapSeed, sapMat);
sapPts.geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
sapPts.geometry.attributes.aColor.setUsage(THREE.DynamicDrawUsage);
treeGroup.add(sapPts);
const S_GOLD=new THREE.Color('#ffd98a'), S_PINK=new THREE.Color('#ff86bd'), S_WARM=new THREE.Color('#ffe6c8');
function updateSap(dt){
  for(let i=0;i<SAP_N;i++){
    let s=sapS[i]+sapV[i]*dt;
    if(s>=1){ s-=1; sapC[i]=Math.floor(rnd()*sapChains.length); }
    sapS[i]=s;
    const ch=sapChains[sapC[i]];
    const M=ch.length/3-1;
    const f=s*M, i0=Math.floor(f), k=f-i0;
    const a=i0*3, b=Math.min(i0+1,M)*3;
    const taper=1-0.7*s;
    sapPos[i*3]  =ch[a]  +(ch[b]  -ch[a]  )*k+sapOff[i*3]*taper;
    sapPos[i*3+1]=ch[a+1]+(ch[b+1]-ch[a+1])*k+sapOff[i*3+1]*taper;
    sapPos[i*3+2]=ch[a+2]+(ch[b+2]-ch[a+2])*k+sapOff[i*3+2]*taper;
    if(s<0.5) tmpCol.copy(S_GOLD).lerp(S_PINK,s/0.5); else tmpCol.copy(S_PINK).lerp(S_WARM,(s-0.5)/0.5);
    const fade=Math.min(1,s/0.06)*Math.min(1,(1-s)/0.1);
    sapCol[i*3]=tmpCol.r*fade; sapCol[i*3+1]=tmpCol.g*fade; sapCol[i*3+2]=tmpCol.b*fade;
  }
  sapPts.geometry.attributes.position.needsUpdate=true;
  sapPts.geometry.attributes.aColor.needsUpdate=true;
}

/* ================= falling stars: they drift down like leaves and settle as glowing dust ================= */
const FALL_N=200, DUST_N=1600;
const fPos=new Float32Array(FALL_N*3), fCol=new Float32Array(FALL_N*3), fSeed=new Float32Array(FALL_N);
const fBase=new Float32Array(FALL_N*3), fVy=new Float32Array(FALL_N), fAmp=new Float32Array(FALL_N);
const fPh=new Float32Array(FALL_N), fAge=new Float32Array(FALL_N), fWait=new Float32Array(FALL_N);
for(let i=0;i<FALL_N;i++){ fSeed[i]=rnd(); fWait[i]=rnd()*9; fPh[i]=rnd()*6.28; }
const fallMat = makeStarMat({size:0.1, opacity:1, tw:0.4});
const fallPts = makeStarPoints(fPos, fCol, fSeed, fallMat);
fallPts.geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
fallPts.geometry.attributes.aColor.setUsage(THREE.DynamicDrawUsage);
treeGroup.add(fallPts);

const dPos=new Float32Array(DUST_N*3), dCol=new Float32Array(DUST_N*3), dSeed=new Float32Array(DUST_N), dBirth=new Float32Array(DUST_N);
const dustMat = makeStarMat({size:0.09, opacity:1, tw:0.6, birth:true});
const dustBirthAttr = new THREE.BufferAttribute(dBirth,1);
const dustPts = makeStarPoints(dPos, dCol, dSeed, dustMat, {aBirth:dustBirthAttr});
['position','aColor'].forEach(n=>dustPts.geometry.attributes[n].setUsage(THREE.DynamicDrawUsage));
dustBirthAttr.setUsage(THREE.DynamicDrawUsage);
dustPts.geometry.setDrawRange(0,0);
treeGroup.add(dustPts);
let dHead=0, dCount=0, dDirty=false;

function spawnFaller(i){
  const p=pointInClump(pickClump());
  fPos[i*3]=p.x; fPos[i*3+1]=p.y; fPos[i*3+2]=p.z;
  canopyHue(p,tmpCol); tmpCol.multiplyScalar(0.75);
  fBase[i*3]=tmpCol.r; fBase[i*3+1]=tmpCol.g; fBase[i*3+2]=tmpCol.b;
  fVy[i]=0.26+rnd()*0.24; fAmp[i]=0.08+rnd()*0.16; fPh[i]=rnd()*6.28; fAge[i]=0;
}
function addDust(i){
  const k=dHead; dHead=(dHead+1)%DUST_N; dCount=Math.min(DUST_N,dCount+1);
  dPos[k*3]  =fPos[i*3]  +(rnd()-0.5)*0.12;
  dPos[k*3+1]=GROUND_Y+0.01+rnd()*0.02;
  dPos[k*3+2]=fPos[i*3+2]+(rnd()-0.5)*0.12;
  dCol[k*3]=fBase[i*3]*0.9; dCol[k*3+1]=fBase[i*3+1]*0.9; dCol[k*3+2]=fBase[i*3+2]*0.9;
  dBirth[k]=elapsed; dSeed[k]=rnd();
  dDirty=true;
}
function updateFallers(dt){
  for(let i=0;i<FALL_N;i++){
    if(fWait[i]>0){
      fWait[i]-=dt;
      if(fWait[i]<=0) spawnFaller(i);
      else { fCol[i*3]=fCol[i*3+1]=fCol[i*3+2]=0; continue; }
    }
    fAge[i]+=dt;
    const x=fPos[i*3], z=fPos[i*3+2];
    const d=Math.hypot(x,z)+0.001;
    fPos[i*3+1]-=fVy[i]*dt;
    fPos[i*3]  +=Math.sin(elapsed*0.9+fPh[i])*fAmp[i]*dt*2.2 + (x/d)*0.03*dt;
    fPos[i*3+2]+=Math.cos(elapsed*0.7+fPh[i]*1.3)*fAmp[i]*dt*2.2 + (z/d)*0.03*dt;
    if(fPos[i*3+1]<=GROUND_Y){
      addDust(i);
      fWait[i]=0.4+rnd()*3.6;
      fCol[i*3]=fCol[i*3+1]=fCol[i*3+2]=0;
      continue;
    }
    const f=Math.min(1,fAge[i]/1.2);
    fCol[i*3]=fBase[i*3]*f; fCol[i*3+1]=fBase[i*3+1]*f; fCol[i*3+2]=fBase[i*3+2]*f;
  }
  fallPts.geometry.attributes.position.needsUpdate=true;
  fallPts.geometry.attributes.aColor.needsUpdate=true;
  if(dDirty){
    dustPts.geometry.setDrawRange(0,dCount);
    dustPts.geometry.attributes.position.needsUpdate=true;
    dustPts.geometry.attributes.aColor.needsUpdate=true;
    dustPts.geometry.attributes.aSeed.needsUpdate=true;
    dustBirthAttr.needsUpdate=true;
    dDirty=false;
  }
}

/* ================= interaction (drag to orbit, wheel or pinch to zoom) ================= */
let dragging=false,lastX=0,lastY=0;
let pinchDist=null, pinchCamDist=camDist;
const dom=renderer.domElement;
function down(x,y){ if(!orbitOn||ZM.goal) return; dragging=true;lastX=x;lastY=y; }
function move(x,y){ if(!dragging) return; camTheta-=(x-lastX)*0.005; camPhi-=(y-lastY)*0.004; lastX=x;lastY=y; }
function up(){dragging=false;}
function touchDist(a,b){ const dx=a.clientX-b.clientX, dy=a.clientY-b.clientY; return Math.sqrt(dx*dx+dy*dy); }
dom.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
dom.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    down(e.touches[0].clientX,e.touches[0].clientY);
    pinchDist=null;
  } else if(e.touches.length===2){
    dragging=false;
    pinchDist=touchDist(e.touches[0],e.touches[1]);
    pinchCamDist=camDist;
  }
},{passive:true});
dom.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=touchDist(e.touches[0],e.touches[1]);
    if(pinchDist&&orbitOn){ camDist = pinchCamDist*(pinchDist/d); }
  } else if(e.touches.length===1 && dragging){
    move(e.touches[0].clientX,e.touches[0].clientY);
  }
},{passive:true});
dom.addEventListener('touchend',e=>{
  if(e.touches.length<2) pinchDist=null;
  if(e.touches.length===0) up();
});
dom.addEventListener('wheel',e=>{ if(orbitOn) camDist+=e.deltaY*0.008; },{passive:true});

    const c=document.createElement('canvas'); c.width=c.height=192;
    const ctx=c.getContext('2d');
    ctx.save(); ctx.beginPath(); ctx.arc(96,96,86,0,Math.PI*2); ctx.clip();
    ctx.fillStyle='#1a0f2a'; ctx.fillRect(0,0,192,192);
    ctx.restore();
    const ring=ctx.createRadialGradient(96,96,78,96,96,92);
    ring.addColorStop(0,'rgba(255,255,255,0)'); ring.addColorStop(0.72,'rgba(255,232,244,.55)'); ring.addColorStop(1,'rgba(255,180,220,.95)');
    ctx.beginPath(); ctx.arc(96,96,89,0,Math.PI*2); ctx.strokeStyle=ring; ctx.lineWidth=7; ctx.stroke();
    return c;
  }
  function makeOrbitStar(src,i){
    const canvas=circleTexture();
    const ctx=canvas.getContext('2d');
    const tex=new THREE.CanvasTexture(canvas); tex.encoding=THREE.sRGBEncoding;
    const img=new Image();
    img.onload=()=>{
      ctx.save(); ctx.beginPath(); ctx.arc(96,96,83,0,Math.PI*2); ctx.clip();
      const s=Math.max(192/img.width,192/img.height), w=img.width*s, h=img.height*s;
      ctx.drawImage(img,(192-w)/2,(192-h)/2,w,h);
      ctx.restore();
      const ring=ctx.createRadialGradient(96,96,78,96,96,92);
      ring.addColorStop(0,'rgba(255,255,255,0)'); ring.addColorStop(0.72,'rgba(255,232,244,.5)'); ring.addColorStop(1,'rgba(255,180,220,.95)');
      ctx.beginPath(); ctx.arc(96,96,89,0,Math.PI*2); ctx.strokeStyle=ring; ctx.lineWidth=7; ctx.stroke();
      tex.needsUpdate=true;
    };
    img.src=src;
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture('#ffb0d8'), color:0xffb0d8, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false, fog:false}));
    halo.scale.setScalar(2.0); halo.renderOrder=24;
    const photo=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0, depthWrite:false, depthTest:false, fog:false}));
    photo.scale.setScalar(1.02); photo.renderOrder=25; photo.userData.index=i;
    const g=new THREE.Group(); g.add(halo,photo); g.visible=false;
    islandGroup.add(g);
    return {g,halo,photo,idx:i};
  }

  const N=9;
  const orbitCenterY = dome.cy*treeGroup.scale.y;
  const orbitR0 = dome.R*treeGroup.scale.y*1.22;
  window.__orbitR0=orbitR0; window.__orbitCenterY=orbitCenterY;
  const stars = GALLERY_PHOTOS.slice(0,N).map((src,i)=>{
    const st=makeOrbitStar(src,i);
    st.radius = orbitR0*(0.82+0.06*(i%4));
    st.tilt = (i/N)*Math.PI*0.86 - Math.PI*0.43 + (rnd()-0.5)*0.18;
    st.speed = (i%2?-1:1)*(0.052+0.012*(i%5));
    st.phase = (i/N)*Math.PI*2 + rnd()*0.4;
    st.bobFreq = 0.5+rnd()*0.4;
    st.bobAmp = 0.14+rnd()*0.1;
    return st;
  });

  window.__orbitStars=stars;
  /* the letter: a glowing envelope drifting among the photo stars */
  const envTex=(function(){
    const c=document.createElement('canvas'); c.width=256; c.height=192; const x=c.getContext('2d');
    const rr=(a,b,w,h,r)=>{ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); };
    let g=x.createLinearGradient(0,20,0,172); g.addColorStop(0,'#ffe0ee'); g.addColorStop(1,'#ff9cc8');
    rr(20,28,216,136,14); x.fillStyle=g; x.fill();
    x.strokeStyle='rgba(255,255,255,.75)'; x.lineWidth=3; x.stroke();
    x.beginPath(); x.moveTo(22,162); x.lineTo(112,96); x.moveTo(234,162); x.lineTo(144,96); x.strokeStyle='rgba(200,60,120,.28)'; x.lineWidth=2; x.stroke();
    g=x.createLinearGradient(0,28,0,112); g.addColorStop(0,'#fff0f7'); g.addColorStop(1,'#ffb4d6');
    x.beginPath(); x.moveTo(24,32); x.lineTo(128,112); x.lineTo(232,32); x.closePath(); x.fillStyle=g; x.fill(); x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=2.5; x.stroke();
    g=x.createRadialGradient(120,98,2,128,106,24); g.addColorStop(0,'#ffb1d3'); g.addColorStop(0.65,'#e0387f'); g.addColorStop(1,'#a81f5a');
    x.beginPath(); x.arc(128,106,22,0,Math.PI*2); x.fillStyle=g; x.shadowColor='rgba(120,10,64,.6)'; x.shadowBlur=8; x.fill(); x.shadowBlur=0;
    x.fillStyle='#fff'; x.font='24px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('♥',128,107);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
  })();
  const envHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture('#ffd98a'), color:0xffd98a, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false, fog:false}));
  envHalo.scale.setScalar(3.2); envHalo.renderOrder=24;
  const envSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:envTex, transparent:true, opacity:0, depthWrite:false, depthTest:false, fog:false}));
  envSpr.scale.set(1.55,1.16,1); envSpr.renderOrder=26; envSpr.userData.letter=true;
  const envG=new THREE.Group(); envG.add(envHalo,envSpr); envG.visible=false; islandGroup.add(envG);

  let revealed=false, revealT0=0;

    $('orbitHint').classList.add('show');

  }
  function updateOrbitStars(){

    const et=ENVS.tf;
    ENVS.phv+=(ENVS.pt-ENVS.phv)*0.16;
    for(const st of stars){

      const y=-z0*Math.sin(st.tilt)+orbitCenterY+Math.sin(et*st.bobFreq+st.phase)*st.bobAmp;
      const z=z0*Math.cos(st.tilt);
      st.g.position.set(x0,y,z);

      st.halo.material.opacity=0.55*fade*tw; st.photo.material.opacity=fade*(1-(st.idx===ENVS.pi?ENVS.phv:0));
      st.halo.scale.setScalar(2.0*tw);
    }
    ENVS.hv+=(ENVS.hide-ENVS.hv)*0.16;
    const eth=0.6+et*0.05, ez0=ENV_R*Math.sin(eth);
    envG.position.set(ENV_R*Math.cos(eth), -ez0*Math.sin(ENV_TILT)+orbitCenterY+0.35+Math.sin(et*0.8)*0.2, ez0*Math.cos(ENV_TILT));
    envSpr.material.rotation=ENVS.frozen?0:Math.sin(et*0.9)*0.13;
    envSpr.material.opacity=fade*(1-ENVS.hv);
    envHalo.material.opacity=fade*(0.5+0.35*Math.sin(elapsed*2.2))*(1-ENVS.hv);
    envHalo.scale.setScalar(3.0+0.5*Math.sin(elapsed*2.2));
  }

  /* tap a star to open its photo */
  const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
  const photoWrap=$('photoWrap'), photoImg=$('photoImg'), photoCap=$('photoCap');
  function openPhoto(i){
    photoImg.src=GALLERY_PHOTOS[i]; photoCap.textContent=GALLERY_CAPTIONS[i]||'';
    photoWrap.classList.add('show');
    $('orbitHint').classList.remove('show');
  }
  function closePhoto(){
    if(!photoWrap.classList.contains('show')) return;

  }
  /* tap a photo star: the camera flies in to it, then the photo card opens */
  function startPhoto(i){

    $('orbitHint').classList.remove('show'); document.body.classList.add('zooming');
    (function wait(){ if(ZM.goal!==1) return; if(ZM.mix<0.95){ setTimeout(wait,60); return; } ENVS.pt=1; openPhoto(i); Sfx.chime(4); })();
  }
  $('photoClose').addEventListener('click', e=>{ e.stopPropagation(); closePhoto(); });
  $('photoVeil').addEventListener('click', closePhoto);
  let downX=0, downY=0, downT=0;
  renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; downT=performance.now(); });
  renderer.domElement.addEventListener('pointerup', e=>{
    if(!revealed||state!=='done'||ZM.goal||ZM.mix>0.03) return;
    if(Math.hypot(e.clientX-downX,e.clientY-downY)>10 || performance.now()-downT>500) return;
    ndc.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
    raycaster.setFromCamera(ndc,camera);
    const hits=raycaster.intersectObjects(stars.map(s=>s.photo).concat([envSpr,moonObjs[0]]));
    if(hits.length){
      const o=hits[0].object;
      if(o.userData.letter){ window.__startLetter&&window.__startLetter(); }
      else if(o===moonObjs[0]){ Sfx.init(); Sfx.chime(6); emit(o.position,26,1.4,[disp('#dcd6ff'),disp('#bfe6ff'),disp('#ffffff')],1.3,0.15); }
      else startPhoto(o.userData.index);

    else {
      const p=raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction,8.5+rnd()*3);

      lastTreeTap=elapsed;

  window.__revealOrbit=reveal;
  window.__updateOrbitStars=updateOrbitStars;
})();

/* ---- sound: a tiny synth, so no audio files are needed ---- */
const Sfx=(function(){
  let ctx=null, master=null, bus=null, on=true, pad=null, music=null;
  const NOTES=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98];
  function init(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=on?1:0; master.connect(ctx.destination);
    bus=ctx.createGain(); bus.gain.value=0.9; bus.connect(master);
    const dl=ctx.createDelay(1); dl.delayTime.value=0.27;
    const fb=ctx.createGain(); fb.gain.value=0.42;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
    const wet=ctx.createGain(); wet.gain.value=0.5;
    bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(master);
  }
  function tone(f,t0,dur,vol,type){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(bus); o.start(t0); o.stop(t0+dur+0.05);
  }
  function chime(n){
    if(!ctx||!on) return;
    if(ctx.state==='suspended') ctx.resume();
    const f=NOTES[Math.min(Math.max(n,0),NOTES.length-1)], t=ctx.currentTime+0.01;
    tone(f,t,1.8,0.2); tone(f*2,t,1.0,0.06); tone(f*3.01,t,0.5,0.02);
  }
  function arpeggio(){
    if(!ctx||!on) return;
    const t=ctx.currentTime+0.05;
    [0,2,4,5,7,8].forEach((n,i)=>{ tone(NOTES[n],t+i*0.11,2.4,0.16); tone(NOTES[n]*2,t+i*0.11,1.2,0.05); });
  }
  function thump(){
    if(!ctx||!on) return;
    const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+0.6);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+1);
  }
  function startPad(){
    if(pad||music) return;
    if(MUSIC_URL){
      music=new Audio(MUSIC_URL); music.loop=true; music.volume=0.7; music.muted=!on;
      music.play().catch(()=>{});
      return;
    }
    if(!ctx) return;
    const t=ctx.currentTime;
    pad=ctx.createGain(); pad.gain.setValueAtTime(0.0001,t); pad.gain.linearRampToValueAtTime(0.07,t+6); pad.connect(bus);
    [[130.81,0.5],[196.0,0.4],[329.63,0.28],[392.0,0.22],[493.88,0.16]].forEach(([f,v],i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
      o.type='sine'; o.frequency.value=f; o.detune.value=(i%2?5:-5);
      g.gain.value=v; lfo.frequency.value=0.08+i*0.031; lg.gain.value=v*0.5;
      lfo.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(pad); o.start(); lfo.start();
    });
  }
  function heartbeat(){
    if(!ctx||!on) return;
    [0,0.3].forEach((d,i)=>{
      const t=ctx.currentTime+d, o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(i?78:92,t); o.frequency.exponentialRampToValueAtTime(48,t+0.16);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(i?0.28:0.4,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.35);
    });
  }
  function toggle(){
    on=!on;
    if(master) master.gain.setTargetAtTime(on?1:0, ctx.currentTime, 0.05);
    if(music) music.muted=!on;
    return on;
  }
  return {init,chime,arpeggio,thump,heartbeat,startPad,toggle};
})();

/* ---- sparks (one shared pool, world space) ---- */
const SPARK_N=360;
const spPos=new Float32Array(SPARK_N*3), spCol=new Float32Array(SPARK_N*3), spSeed=new Float32Array(SPARK_N);
const spVel=new Float32Array(SPARK_N*3), spBase=new Float32Array(SPARK_N*3);
const spAge=new Float32Array(SPARK_N).fill(9), spLife=new Float32Array(SPARK_N).fill(1), spG=new Float32Array(SPARK_N);
for(let i=0;i<SPARK_N;i++){ spSeed[i]=rnd(); spPos[i*3+1]=-999; }
const sparkMat=makeStarMat({size:0.17, opacity:1, tw:0.25});
const sparkPts=makeStarPoints(spPos,spCol,spSeed,sparkMat);
sparkPts.geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
sparkPts.geometry.attributes.aColor.setUsage(THREE.DynamicDrawUsage);
scene.add(sparkPts);
let spHead=0;
function emit(p,n,speed,cols,life,grav){
  for(let k=0;k<n;k++){
    const i=spHead; spHead=(spHead+1)%SPARK_N;
    const a=rnd()*6.283, b=Math.acos(2*rnd()-1), sp=speed*(0.3+rnd()*0.9);
    spPos[i*3]=p.x; spPos[i*3+1]=p.y; spPos[i*3+2]=p.z;
    spVel[i*3]=Math.sin(b)*Math.cos(a)*sp; spVel[i*3+1]=Math.cos(b)*sp; spVel[i*3+2]=Math.sin(b)*Math.sin(a)*sp;
    const c=cols[(rnd()*cols.length)|0], br=0.7+rnd()*0.5;
    spBase[i*3]=c.r*br; spBase[i*3+1]=c.g*br; spBase[i*3+2]=c.b*br;
    spLife[i]=life*(0.6+rnd()*0.8); spAge[i]=0; spG[i]=grav;
  }
}
function updateSparks(dt){
  const drag=Math.max(0,1-1.7*dt);
  for(let i=0;i<SPARK_N;i++){
    if(spAge[i]>=spLife[i]){ spCol[i*3]=spCol[i*3+1]=spCol[i*3+2]=0; continue; }
    spAge[i]+=dt;
    spVel[i*3]*=drag; spVel[i*3+1]=spVel[i*3+1]*drag-spG[i]*dt; spVel[i*3+2]*=drag;
    spPos[i*3]+=spVel[i*3]*dt; spPos[i*3+1]+=spVel[i*3+1]*dt; spPos[i*3+2]+=spVel[i*3+2]*dt;
    const u=spAge[i]/spLife[i], f=Math.pow(1-u,1.3)*Math.min(1,spAge[i]/0.06);
    spCol[i*3]=spBase[i*3]*f; spCol[i*3+1]=spBase[i*3+1]*f; spCol[i*3+2]=spBase[i*3+2]*f;
  }
  sparkPts.geometry.attributes.position.needsUpdate=true;
  sparkPts.geometry.attributes.aColor.needsUpdate=true;
}

/* ---- the nine stars: a heart, one star for each month ---- */
const landCam=new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 400);

const fwdAxis=new THREE.Vector3(), C=new THREE.Vector3(), Bpt=new THREE.Vector3(0,0.35,0);
/* the heart: nine stars spaced evenly along its outline (the tip, then four up each side; the dip on top falls between the last two) */
const LINK_PER=30;
const heartCurve=(function(){
  const N=600, xy=[];
  for(let i=0;i<=N;i++){ const t=Math.PI*(1-i/N); xy.push([16*Math.pow(Math.sin(t),3), 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]); }

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  const gt=elapsed-growStart;      /* time since the seed touched the ground */
  for(const m of starMats) m.uniforms.uTime.value=elapsed;
  updateLanding(dt);

  woodSwarms.forEach(g=>{
    const tt = clamp((gt-g.delay)/g.dur,0,1);
    g.points.geometry.setDrawRange(0, Math.round(easeInOutQuint(tt)*g.total));
    g.mat.uniforms.uOpacity.value = tt>=1
      ? g.targetOpacity*(0.92+Math.sin(elapsed*1.8+g.delay)*0.08)
      : g.targetOpacity;
  });

  const st=(gt-CANOPY_START)/CANOPY_DUR;
  let bloom=0;
  if(st>0){
    const e=easeInOutQuint(Math.min(st,1));
    const fadeIn=Math.min(1,st*2.5);
    bloom=fadeIn;
    canopyPts.geometry.setDrawRange(0, Math.round(e*canopyPts.userData.total));
    heroPts.geometry.setDrawRange(0, Math.round(e*heroPts.userData.total));
    canopyMat.uniforms.uOpacity.value=CANOPY_OP*fadeIn;
    heroMat.uniforms.uOpacity.value=HERO_OP*fadeIn;
  }
  /* the ground and its light wake up together with the canopy */
  groundGlow.material.opacity = bloom*(0.85+0.15*Math.sin(elapsed*0.9));
  canopyLight.intensity = 1.9*bloom*(0.93+0.07*Math.sin(elapsed*1.3));

  if(gt>SAP_START){
    sapMat.uniforms.uOpacity.value=SAP_OP*clamp((gt-SAP_START)/1.6,0,1);
    updateSap(dt);
  }
  if(gt>FALL_START) updateFallers(dt);
  window.__maybeShowDock();
  if(window.__updateOrbitStars) window.__updateOrbitStars();
  if(window.__updateKids) window.__updateKids(dt);
  if(window.__updateRocket) window.__updateRocket(dt);
  if(gt>CANOPY_START+CANOPY_DUR*0.6){
    strandMat.uniforms.uOpacity.value=STRAND_OP*clamp((gt-CANOPY_START-CANOPY_DUR*0.6)/2.2,0,1);
    updateStrands();
  }

  {
    const posAttr = window.__ff.geometry.getAttribute('position');
    for(let i=0;i<fireflies.length;i++){
      const f=fireflies[i];
      posAttr.array[i*3+1] = f.base + Math.sin(elapsed*f.speed+f.phase)*0.6+0.2;
    }
    posAttr.needsUpdate = true;
    window.__ff.material.opacity = 0.55 + Math.sin(elapsed*2)*0.15;
  }

  bgStars.forEach(s=>{ s.sp.material.opacity=s.base*(0.55+0.45*Math.sin(elapsed*1.3+s.ph)); });
  bgWisps.forEach(s=>{ s.sp.material.opacity=s.base*(0.8+0.2*Math.sin(elapsed*0.22+s.ph)); s.sp.position.y+=Math.sin(elapsed*0.15+s.ph)*0.003; });

  /* the fragment drifts: slow bob and a slight tilt, tree and all */
  islandGroup.position.y=Math.sin(elapsed*0.55)*0.16+islandRise;
  islandGroup.rotation.z=Math.sin(elapsed*0.37)*0.022;
  islandGroup.rotation.x=Math.sin(elapsed*0.29+1.2)*0.016;
  for(const d of debris){
    d.m.position.set(
      d.base.x+Math.sin(elapsed*d.fr+d.ph)*d.amp*0.6,
      d.base.y+Math.sin(elapsed*d.fr*1.3+d.ph*2)*d.amp,
      d.base.z+Math.cos(elapsed*d.fr+d.ph)*d.amp*0.6);
    d.m.rotation.x+=d.sp.x*dt; d.m.rotation.y+=d.sp.y*dt; d.m.rotation.z+=d.sp.z*dt;
  }
  crackMat.uniforms.uOpacity.value=0.95*bloom;

  dripMat.uniforms.uOpacity.value=bloom;
  if(bloom>0) updateDrip(dt);

  ZM.mix+=(ZM.goal-ZM.mix)*Math.min(1,dt*3);
  updateCamera();
  renderer.render(scene,camera);
}
